# Runtime of the Claude plugin: pins lt-eli-mcp and every transitive dependency
# (with hashes) in uv.lock, so the plugin runs exactly what was reviewed.
# Started by plugin.json as: uvx lt-eli-mcp==0.3.3 (Claude Code's locked launch reads this uv.lock)
[project]
name = "lt-eli-mcp-plugin-runtime"
version = "0.3.3"
requires-python = ">=3.11,<3.14"
dependencies = ["lt-eli-mcp==0.3.3"]

[tool.uv]
package = false
